name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows only, on purpose. The plugin exists to make Git for Windows
        # resolvable as `bash`, and its discovery fixtures assert Windows
        # layout (Program Files candidates, drive-letter paths), so the suite
        # fails on Linux and macOS by construction rather than by regression.
        # Both ends of the supported engine range run: newest (24) and the
        # lowest supported line (22).
        os: [windows-latest]
        node: [24, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # There is no dsh-plugin.json (this is a core shell plugin, not a TUI
      # plugin) and no build step: lib/ is the published source.
      - run: pnpm check:encoding
      - run: pnpm test
