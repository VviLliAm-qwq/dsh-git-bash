name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # engines: ^22.19 || >=24. The plugin only changes anything on Windows
        # (it prepends the Git for Windows bin directory to the host PATH), but
        # the discovery rules are pure and injectable, so every supported OS
        # runs the suite; the win32 cases exercise a real installation when one
        # is present and skip otherwise.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # There is no dsh-plugin.json (this is a core shell plugin, not a TUI
      # plugin) and no build step: lib/ is the published source.
      - run: pnpm check:encoding
      - run: pnpm test
